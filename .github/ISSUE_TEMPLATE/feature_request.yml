name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 中的路线图：云同步、提醒推送、账号、广告、统计明确不在 1.0.0 范围内。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我理解这个项目坚持「无广告、零权限、纯本地」的定位
          required: true
