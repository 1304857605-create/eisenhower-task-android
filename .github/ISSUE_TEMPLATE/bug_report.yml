name: Bug 反馈
description: 报告一个可以复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，避免重复。
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手机型号、Android 版本、MIUI/HyperOS 版本
      placeholder: 例如：Xiaomi 14 / Android 15 / HyperOS 2.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置 → 关于 中显示的版本号
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述如何触发问题
      placeholder: |
        1. 打开应用
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图 / 日志（可选）
      description: 可直接拖入图片；请勿包含个人隐私信息
